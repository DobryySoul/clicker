
name: Build AutoClicker for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyautogui keyboard pynput pyinstaller ctypes

      - name: Build EXE
        run: |
          pyinstaller --onefile --console --clean --collect-all pynput --name AutoClicker autoclick.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Windows
          path: dist/AutoClicker.exe
